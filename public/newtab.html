<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvel onglet · Éclaircie</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    body { min-height: 100dvh; background:
      radial-gradient(60vw 60vw at 110% -10%, rgb(247 185 206 / .55), transparent 60%),
      radial-gradient(50vw 50vw at -10% 110%, rgb(22 75 255 / .14), transparent 60%), var(--bg); }
    .nt { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
    .nt-top { display: flex; justify-content: space-between; align-items: center; }
    .nt-top a { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; font-weight: 700; color: inherit; text-decoration: none; }
    .clock { text-align: center; margin: 7vh 0 8px; }
    .clock time { font-family: var(--serif); font-size: clamp(64px, 14vw, 120px); font-weight: 500; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .clock p { margin: 10px 0 0; color: var(--muted); font-size: 18px; }
    .search { display: flex; align-items: center; gap: 8px; max-width: 620px; margin: 28px auto 48px; padding: 6px 6px 6px 22px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); border: 1.5px solid var(--line); }
    .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px rgb(22 75 255 / .15); }
    .search input { flex: 1; border: 0; background: none; min-height: 48px; font-size: 17px; outline: none; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .tile { --c: var(--cream); display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: var(--radius); background: var(--c); color: var(--ink); text-decoration: none; box-shadow: var(--shadow); transition: transform .2s; min-height: 160px; }
    .tile:hover { transform: translateY(-3px); }
    .tile h3 { font-family: var(--sans); font-size: 18px; font-weight: 600; line-height: 1.3; }
    .tile small { margin-top: auto; color: #55524B; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .head h2 { font-size: 24px; }
  </style>
</head>
<body>
  <div class="nt">
    <div class="nt-top"><a href="./#/feed"><span class="brand-mark" aria-hidden="true"></span>Éclaircie</a>
      <a class="btn btn-ghost btn-sm" href="./#/profile" style="font-family:var(--sans);font-size:14px">Réglages</a></div>
    <div class="clock"><time id="clock">--:--</time><p id="hello"></p></div>
    <form class="search" action="https://duckduckgo.com/" method="get" role="search">
      <label for="s" class="sr">Rechercher sur le web</label>
      <input id="s" name="q" placeholder="Rechercher sur le web…" autocomplete="off" autofocus>
      <button class="btn btn-primary" type="submit">Rechercher</button>
    </form>
    <div class="head"><h2>Vos bonnes nouvelles</h2><a href="./#/feed" class="muted">Tout voir →</a></div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </div>
  <script src="shared.js"></script>
  <script src="demo-data.js"></script>
  <script>
    let prefs = {};
    try { prefs = JSON.parse(localStorage.getItem('ecl:prefs')) || {}; } catch { }
    if (prefs.theme && prefs.theme !== 'auto') document.documentElement.dataset.theme = prefs.theme;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function tick() {
      const d = new Date(), h = d.getHours();
      document.getElementById('clock').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('hello').textContent = `${h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir'}${prefs.name ? ', ' + prefs.name : ''} · ${d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}`;
    }
    tick(); setInterval(tick, 10e3);
    (async () => {
      let list;
      try { list = (await (await fetch('/api/news?raw=1', { signal: AbortSignal.timeout(8000) })).json()).articles; }
      catch { list = window.DEMO_ARTICLES; }
      const { visible } = Eclaircie.filterArticles(list, Object.assign({ blocked: ['war', 'murder', 'sexual', 'terror'], tone: 40 }, prefs));
      const colors = ['var(--cream)', 'var(--pink-soft)', 'var(--blue-soft)', '#F3EDDF'];
      document.getElementById('grid').innerHTML = visible.slice(0, 6).map((a, i) => {
        const t = Eclaircie.TOPICS.find(x => x.id === a.ai.topic) || { emoji: '📰', label: '' };
        return `<a class="tile" style="--c:${colors[i % 4]}" href="${a.url ? esc(a.url) : './#/article/' + encodeURIComponent(a.id)}">
          <span class="tag">${t.emoji} ${t.label}</span><h3>${esc(a.title)}</h3><small>${esc(a.source)}</small></a>`;
      }).join('') || '<p class="muted">Aucune nouvelle pour le moment.</p>';
    })();
  </script>
</body>
</html>
